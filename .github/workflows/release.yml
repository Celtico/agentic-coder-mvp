# Publishing a version, as GesProd numbers them: the version is the count of commits of main (v322…), with
# nothing to bump by hand. Actions › «Publica una versió» › Run workflow: it creates the Release vN with its
# notes (the commits since the previous version) and attaches the app built on GitHub's machines: a .dmg
# for Macs with Apple Silicon and an AppImage and a .deb for Linux. Nothing is signed (no secrets).
# docs/publicar.md explains it.
name: Publica una versió

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      commit: ${{ steps.version.outputs.commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: The version is the count of commits
        id: version
        shell: bash
        run: |
          echo "version=$(git rev-list --count HEAD)" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: The Release, with the commits since the previous version as its notes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          previous="$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || true)"
          range="${previous:+${previous}..}HEAD"
          { echo "Versió ${VERSION} (commit $(git rev-parse --short HEAD))."; echo; echo "## Canvis${previous:+ des de ${previous}}"; echo;
            git log --no-merges --format='- %s' "$range"; } > release-notes.md
          gh release create "v${VERSION}" --target "$GITHUB_SHA" --title "v${VERSION}" --notes-file release-notes.md

  build:
    needs: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            dist: dist:mac
            files: dist/*.dmg
          - os: ubuntu-latest
            dist: dist:linux
            files: dist/*.AppImage dist/*.deb
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # The tests are the Mac's (the app's default engine); the Linux job only builds.
      - if: runner.os == 'macOS'
        run: npm test

      # The installed app carries its version (0.0.<count>, the count shown as vN) and its commit (src/electron/app-version.cjs).
      - name: Build
        run: npm run ${{ matrix.dist }} -- --publish never -c.extraMetadata.version=0.0.${{ needs.release.outputs.version }} -c.extraMetadata.appCommit=${{ needs.release.outputs.commit }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Attach to the Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "v${{ needs.release.outputs.version }}" ${{ matrix.files }} --clobber
